<!DOCTYPE html>
<html lang="zh-CN" data-theme="sun">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音直播重点指标监控表格</title>
    <style>
        :root,
        :root[data-theme="sun"],
        [data-theme="sun"] {
            --bg-base: #eef1f6;
            --bg-ambient:
                radial-gradient(circle at 14% 12%, rgba(0, 113, 227, 0.14), transparent 38%),
                radial-gradient(circle at 86% 18%, rgba(52, 199, 89, 0.11), transparent 36%),
                radial-gradient(circle at 52% 88%, rgba(255, 159, 10, 0.08), transparent 44%),
                #eef1f6;
            --glass-pill-bg: rgba(255, 255, 255, 0.68);
            --glass-card-bg: rgba(255, 255, 255, 0.72);
            --glass-subcard-bg: rgba(255, 255, 255, 0.88);
            --glass-head-bg: rgba(248, 250, 253, 0.75);
            --glass-rim: rgba(255, 255, 255, 0.82);
            --border-color: rgba(15, 23, 42, 0.09);
            --border-subtle: rgba(15, 23, 42, 0.05);
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --gpm-color: #b45309;
            --ratio-color: #15803d;
            --cost-color: #0369a1;
            --accent-blue: #0071e3;
            --accent-blue-subtle: rgba(0, 113, 227, 0.10);
            --row-hover: rgba(0, 0, 0, 0.025);
            --row-expanded-bg: rgba(0, 113, 227, 0.05);
            --subtable-wrap-bg: rgba(241, 244, 249, 0.62);
            --subtable-head-bg: rgba(245, 247, 250, 0.9);
            --cart-tag-bg: rgba(217, 119, 6, 0.10);
            --cart-tag-border: rgba(217, 119, 6, 0.25);
            --cart-tag-color: #b45309;
            --pulse-bg: rgba(22, 163, 74, 0.10);
            --pulse-border: rgba(22, 163, 74, 0.24);
            --pulse-color: #15803d;
            --btn-bg: rgba(255, 255, 255, 0.62);
            --btn-border: rgba(15, 23, 42, 0.10);
            --btn-color: #1d1d1f;
            --seg-bg: rgba(15, 23, 42, 0.06);
            --seg-thumb-bg: rgba(255, 255, 255, 0.96);
            --seg-thumb-shadow: 0 2px 8px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            --pill-shadow: 0 10px 32px rgba(15, 23, 42, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.85);
            --card-shadow: 0 20px 50px rgba(15, 23, 42, 0.07), 0 2px 8px rgba(15, 23, 42, 0.03), inset 0 1px 1px rgba(255, 255, 255, 0.85);
            --subtable-shadow: 0 6px 20px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            --flash-bg: rgba(0, 113, 227, 0.12);
            --toast-bg: rgba(29, 29, 31, 0.84);
            --toast-text: #f5f5f7;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        :root[data-theme="dark"],
        [data-theme="dark"] {
            --bg-base: #07090d;
            --bg-ambient:
                radial-gradient(circle at 16% 10%, rgba(10, 132, 255, 0.18), transparent 40%),
                radial-gradient(circle at 84% 22%, rgba(48, 209, 88, 0.12), transparent 38%),
                radial-gradient(circle at 50% 90%, rgba(191, 90, 242, 0.10), transparent 45%),
                #07090d;
            --glass-pill-bg: rgba(24, 26, 32, 0.72);
            --glass-card-bg: rgba(22, 24, 30, 0.70);
            --glass-subcard-bg: rgba(30, 32, 40, 0.88);
            --glass-head-bg: rgba(34, 36, 44, 0.72);
            --glass-rim: rgba(255, 255, 255, 0.22);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --gpm-color: #fbbf24;
            --ratio-color: #34d399;
            --cost-color: #38bdf8;
            --accent-blue: #0a84ff;
            --accent-blue-subtle: rgba(10, 132, 255, 0.16);
            --row-hover: rgba(255, 255, 255, 0.04);
            --row-expanded-bg: rgba(10, 132, 255, 0.10);
            --subtable-wrap-bg: rgba(12, 14, 18, 0.65);
            --subtable-head-bg: rgba(38, 40, 48, 0.92);
            --cart-tag-bg: rgba(245, 158, 11, 0.16);
            --cart-tag-border: rgba(245, 158, 11, 0.32);
            --cart-tag-color: #fbbf24;
            --pulse-bg: rgba(48, 209, 88, 0.15);
            --pulse-border: rgba(48, 209, 88, 0.30);
            --pulse-color: #30d158;
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-border: rgba(255, 255, 255, 0.14);
            --btn-color: #f5f5f7;
            --seg-bg: rgba(255, 255, 255, 0.08);
            --seg-thumb-bg: rgba(58, 60, 70, 0.92);
            --seg-thumb-shadow: 0 2px 10px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            --pill-shadow: 0 16px 40px rgba(0, 0, 0, 0.48), inset 0 1px 1px rgba(255, 255, 255, 0.22);
            --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.20);
            --subtable-shadow: 0 10px 28px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            --flash-bg: rgba(10, 132, 255, 0.22);
            --toast-bg: rgba(34, 36, 44, 0.88);
            --toast-text: #f5f5f7;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: var(--bg-ambient);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out);
        }

        header.top-bar {
            width: calc(100% - 48px);
            max-width: 1512px;
            margin: 16px auto 0;
            background: var(--glass-pill-bg);
            backdrop-filter: blur(26px) saturate(185%);
            -webkit-backdrop-filter: blur(26px) saturate(185%);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            position: sticky;
            top: 16px;
            z-index: 100;
            box-shadow: var(--pill-shadow);
            transition: background-color 0.28s var(--ease-out), border-color 0.28s var(--ease-out);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.015em;
        }

        .pulse-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--pulse-bg);
            color: var(--pulse-color);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.015em;
            border: 1px solid var(--pulse-border);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--pulse-color);
            box-shadow: 0 0 8px var(--pulse-color);
        }

        .room-counter {
            font-size: 12px;
            letter-spacing: 0.01em;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 12px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-segmented-control {
            position: relative;
            display: inline-grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            background: var(--seg-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 2px;
            min-width: 132px;
        }

        .seg-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            background: var(--seg-thumb-bg);
            border-radius: 999px;
            box-shadow: var(--seg-thumb-shadow);
            pointer-events: none;
            will-change: transform;
        }

        .theme-seg-btn {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 5px 11px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.18s ease, transform 100ms var(--ease-out);
            touch-action: manipulation;
        }

        .theme-seg-btn:active {
            transform: scale(0.95);
        }

        .theme-seg-btn svg {
            flex-shrink: 0;
        }

        .theme-seg-btn.active {
            color: var(--text-main);
        }

        .refresh-now-btn {
            min-width: 92px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 14px;
            border: 1px solid var(--accent-blue);
            border-radius: 999px;
            background: var(--accent-blue-subtle);
            color: var(--accent-blue);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 110ms var(--ease-out), background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }

        .refresh-now-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        @media (hover: hover) and (pointer: fine) {
            .refresh-now-btn:hover:not(:disabled) {
                background: var(--accent-blue);
                color: #ffffff;
            }
        }

        .refresh-now-btn:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        .refresh-now-btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .refresh-now-btn[data-state="success"] {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.14);
            color: #10b981;
        }

        .refresh-now-btn[data-state="error"] {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.14);
            color: #ef4444;
        }

        .refresh-now-icon {
            width: 13px;
            height: 13px;
            flex: none;
        }

        .refresh-now-btn[data-state="loading"] .refresh-now-icon {
            animation: refresh-spin 0.8s linear infinite;
        }

        @keyframes refresh-spin {
            to { transform: rotate(360deg); }
        }

        .refresh-toast {
            position: fixed;
            top: 82px;
            right: 28px;
            z-index: 1200;
            min-width: 200px;
            max-width: min(360px, calc(100vw - 48px));
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--toast-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: var(--toast-text);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            font-size: 13px;
            font-weight: 500;
            transform: translateY(-10px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s var(--ease-out), transform 0.28s var(--ease-spring);
        }

        .refresh-toast[data-visible="true"] {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .refresh-toast[data-state="success"] {
            border-color: rgba(16, 185, 129, 0.4);
            color: #10b981;
        }

        .refresh-toast[data-state="warning"] {
            border-color: rgba(245, 158, 11, 0.4);
            color: #f59e0b;
        }

        .refresh-toast[data-state="error"] {
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        .refresh-toast-dot {
            width: 8px;
            height: 8px;
            flex: none;
            border-radius: 50%;
            background: currentColor;
        }

        main.container {
            flex: 1;
            padding: 20px 24px 36px;
            max-width: 1560px;
            margin: 0 auto;
            width: 100%;
        }

        .table-card {
            background: var(--glass-card-bg);
            backdrop-filter: blur(28px) saturate(185%);
            -webkit-backdrop-filter: blur(28px) saturate(185%);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            overflow-x: auto;
            box-shadow: var(--card-shadow);
            transition: background-color 0.28s var(--ease-out), border-color 0.28s var(--ease-out);
        }

        table.monitoring-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        table.monitoring-table thead tr {
            background: var(--glass-head-bg);
            border-bottom: 1px solid var(--border-color);
        }

        table.monitoring-table th {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.015em;
        }

        table.monitoring-table > tbody > tr {
            border-bottom: 1px solid var(--border-subtle);
        }

        table.monitoring-table td {
            padding: 15px 16px;
            vertical-align: middle;
            font-size: 14px;
        }

        .room-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 110ms var(--ease-out);
        }

        .main-row:active .room-cell {
            transform: scale(0.985);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.45);
        }

        .status-dot.offline {
            background-color: #ef4444;
        }

        .room-name-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .num-cell {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .val-gpm {
            color: var(--gpm-color);
            font-size: 15px;
        }

        .val-watch-ratio {
            color: var(--ratio-color);
            font-size: 15px;
        }

        .val-cost {
            color: var(--cost-color);
        }

        .val-muted {
            color: var(--text-muted);
        }

        .val-time {
            font-size: 12px;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        .flash-update {
            animation: highlight-pulse 0.8s var(--ease-out);
        }

        @keyframes highlight-pulse {
            0% { background-color: var(--flash-bg); }
            100% { background-color: transparent; }
        }

        .main-row {
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: border-left-color 0.2s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .main-row:hover {
                background-color: var(--row-hover);
            }
        }

        .main-row.is-expanded {
            background-color: var(--row-expanded-bg);
            border-left-color: var(--accent-blue);
        }

        .expand-caret {
            display: inline-block;
            font-size: 10px;
            color: var(--text-muted);
            margin-right: 2px;
            transition: transform 0.26s var(--ease-spring), color 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .main-row.is-expanded .expand-caret {
            transform: rotate(90deg);
            color: var(--accent-blue);
        }

        .card-row {
            background-color: var(--subtable-wrap-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .card-row.hidden {
            display: none;
        }

        .subtable-wrap {
            padding: 12px 20px 16px 30px;
            transform-origin: top center;
        }

        .card-row.is-entering .subtable-wrap {
            animation: subtable-enter 0.26s var(--ease-spring);
        }

        @keyframes subtable-enter {
            from {
                opacity: 0;
                transform: translateY(-6px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .subtable-container {
            background: var(--glass-subcard-bg);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--subtable-shadow);
        }

        table.product-subtable {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table.product-subtable thead tr {
            background: var(--subtable-head-bg);
            border-bottom: 1px solid var(--border-color);
        }

        table.product-subtable th {
            padding: 10px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .product-sort-button {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            width: 100%;
            min-height: 22px;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            letter-spacing: inherit;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.16s ease, transform 100ms var(--ease-out);
        }

        .product-sort-button:active {
            transform: scale(0.97);
        }

        .product-sort-button:hover {
            color: var(--text-main);
        }

        .product-sort-button.is-active {
            color: var(--accent-blue);
        }

        .product-sort-button:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .product-sort-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            flex: 0 0 12px;
            font-size: 10px;
            line-height: 1;
            opacity: 0.35;
        }

        .product-sort-button.is-active .product-sort-indicator {
            opacity: 1;
        }

        table.product-subtable td {
            padding: 10px 12px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
        }

        table.product-subtable tr:last-child td {
            border-bottom: none;
        }

        table.product-subtable > tbody > tr:hover {
            background: var(--row-hover);
        }

        .prod-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-main);
            font-weight: 500;
            max-width: 480px;
        }

        .cart-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 600;
            color: var(--cart-tag-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 18px;
            padding: 0 5px;
            background: var(--cart-tag-bg);
            border: 1px solid var(--cart-tag-border);
            border-radius: 6px;
            font-size: 11px;
        }

        .toggle-all-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-color);
            padding: 5px 14px;
            height: 30px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.01em;
            border-radius: 999px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 110ms var(--ease-out), background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }

        .toggle-all-btn:active {
            transform: scale(0.96);
        }

        @media (hover: hover) and (pointer: fine) {
            .toggle-all-btn:hover {
                background: var(--accent-blue);
                color: #ffffff;
                border-color: var(--accent-blue);
            }
        }

        .empty-view {
            text-align: center;
            padding: 90px 24px;
            color: var(--text-muted);
            background: var(--glass-card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: var(--card-shadow);
        }

        .empty-view svg {
            width: 56px;
            height: 56px;
            stroke: var(--text-muted);
            margin-bottom: 12px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-reduced-transparency: reduce) {
            header.top-bar, .table-card, .refresh-toast, .empty-view {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: var(--glass-subcard-bg);
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-title">
            <span class="pulse-badge">
                <span class="pulse-dot"></span>
                <span>总控实时服务已就绪</span>
            </span>
            <h1>抖音直播核心指标监控表格</h1>
        </div>

        <div class="top-actions">
            <div class="theme-segmented-control" role="group" aria-label="主题模式切换">
                <div class="seg-thumb" id="themeSegThumb"></div>
                <button type="button" class="theme-seg-btn active" id="themeSunBtn" onclick="setTheme('sun')" aria-pressed="true" title="浅色模式 (SUN)">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <span>SUN</span>
                </button>
                <button type="button" class="theme-seg-btn" id="themeDarkBtn" onclick="setTheme('dark')" aria-pressed="false" title="深色模式 (DARK)">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    <span>DARK</span>
                </button>
            </div>

            <button class="refresh-now-btn" id="refreshNowBtn" type="button" data-state="idle" onclick="requestImmediateRefresh()" aria-label="立即刷新全部直播间数据">
                <svg class="refresh-now-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 10-2.34 5.66M20 4v7h-7"/>
                </svg>
                <span id="refreshNowLabel">立即刷新</span>
            </button>
            <div class="room-counter" id="activeCountLabel">当前监控: 0 个直播间</div>
            <button class="toggle-all-btn" id="toggleAllBtn" onclick="toggleAllRooms()">全部展开商品 ▼</button>
        </div>
    </header>

    <div class="refresh-toast" id="refreshToast" data-state="success" data-visible="false" role="status" aria-live="polite">
        <span class="refresh-toast-dot" aria-hidden="true"></span>
        <span id="refreshToastText"></span>
    </div>

    <main class="container">
        <div class="table-card" id="tableCard">
            <table class="monitoring-table">
                <thead>
                    <tr>
                        <th style="padding-left: 20px;">直播间</th>
                        <th style="text-align: right; color: var(--gpm-color);">千次</th>
                        <th style="text-align: right; color: var(--ratio-color);">观看成交率(人数)</th>
                        <th style="text-align: right;">人均观看时长</th>
                        <th style="text-align: right;">投放消耗</th>
                        <th style="text-align: right;">成交老粉占比</th>
                        <th style="text-align: right;">观看互动率(人数)</th>
                        <th style="text-align: right;">观看关注率(人数)</th>
                        <th style="text-align: right;">退款金额占比</th>
                        <th style="text-align: right; padding-right: 20px;">更新时间</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 动态行数据 -->
                </tbody>
            </table>
        </div>

        <div class="empty-view" id="emptyView" style="display:none;">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
            <h3>暂无活跃大屏接入</h3>
            <p style="margin-top:6px;font-size:13px;">请在浏览器中打开抖音电商罗盘大屏并启用油猴哨兵脚本</p>
        </div>
    </main>

    <script>
        const tableBody = document.getElementById('tableBody');
        const emptyElement = document.getElementById('emptyView');
        const tableCard = document.getElementById('tableCard');
        const activeCountLabel = document.getElementById('activeCountLabel');
        const refreshNowBtn = document.getElementById('refreshNowBtn');
        const refreshNowLabel = document.getElementById('refreshNowLabel');
        const refreshToast = document.getElementById('refreshToast');
        const refreshToastText = document.getElementById('refreshToastText');

        let thumbVal = 0;
        let thumbTarget = 0;
        let thumbVel = 0;
        let thumbRaf = null;
        let thumbLast = 0;

        function stepThumbSpring(now) {
            if (!thumbLast) thumbLast = now;
            const dt = Math.min((now - thumbLast) / 1000, 0.032);
            thumbLast = now;
            const omega = (2 * Math.PI) / 0.28;
            const disp = thumbVal - thumbTarget;
            const force = -omega * omega * disp - 2 * 1.0 * omega * thumbVel;
            thumbVel += force * dt;
            thumbVal += thumbVel * dt;
            const thumb = document.getElementById('themeSegThumb');
            if (thumb && thumb.style) thumb.style.transform = `translateX(${thumbVal}%)`;
            if (Math.abs(disp) < 0.08 && Math.abs(thumbVel) < 0.5) {
                thumbVal = thumbTarget;
                thumbVel = 0;
                if (thumb && thumb.style) thumb.style.transform = `translateX(${thumbVal}%)`;
                thumbRaf = null;
                thumbLast = 0;
                return;
            }
            thumbRaf = requestAnimationFrame(stepThumbSpring);
        }

        function setTheme(theme) {
            const chosen = theme === 'dark' ? 'dark' : 'sun';
            document.documentElement.setAttribute('data-theme', chosen);
            try {
                localStorage.setItem('douyin_monitoring_theme', chosen);
            } catch (e) {}
            const nextTarget = chosen === 'dark' ? 100 : 0;
            thumbTarget = nextTarget;
            const thumb = document.getElementById('themeSegThumb');
            const reduceMotion = typeof window !== 'undefined' && typeof window.matchMedia === 'function'
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (typeof requestAnimationFrame !== 'function' || reduceMotion) {
                thumbVal = nextTarget;
                thumbVel = 0;
                if (thumb && thumb.style) thumb.style.transform = `translateX(${thumbVal}%)`;
            } else if (!thumbRaf) {
                thumbLast = 0;
                thumbRaf = requestAnimationFrame(stepThumbSpring);
            }
            const sunBtn = document.getElementById('themeSunBtn');
            const darkBtn = document.getElementById('themeDarkBtn');
            if (sunBtn && darkBtn) {
                if (chosen === 'sun') {
                    sunBtn.classList.add('active');
                    sunBtn.setAttribute('aria-pressed', 'true');
                    darkBtn.classList.remove('active');
                    darkBtn.setAttribute('aria-pressed', 'false');
                } else {
                    darkBtn.classList.add('active');
                    darkBtn.setAttribute('aria-pressed', 'true');
                    sunBtn.classList.remove('active');
                    sunBtn.setAttribute('aria-pressed', 'false');
                }
            }
        }

        // 默认 SUN (浅色主题)
        let initialTheme = 'sun';
        try {
            initialTheme = localStorage.getItem('douyin_monitoring_theme') || 'sun';
        } catch (e) {}
        setTheme(initialTheme);

        const prevValues = {};
        let refreshResetTimer = null;
        let refreshToastTimer = null;

        function setRefreshButtonState(state, label) {
            if (refreshResetTimer) {
                clearTimeout(refreshResetTimer);
                refreshResetTimer = null;
            }
            refreshNowBtn.dataset.state = state;
            refreshNowBtn.disabled = state === 'loading';
            refreshNowLabel.textContent = label;
        }

        function showRefreshToast(state, message) {
            if (refreshToastTimer) clearTimeout(refreshToastTimer);
            refreshToast.dataset.state = state;
            refreshToast.dataset.visible = 'true';
            refreshToastText.textContent = message;
            refreshToastTimer = setTimeout(() => {
                refreshToast.dataset.visible = 'false';
                refreshToastTimer = null;
            }, 3200);
        }

        async function waitForRefreshCompletion(refreshRequestId, targetCount) {
            const deadline = Date.now() + 12000;
            while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, 600));
                const response = await fetch('/api/control/refresh', { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const status = await response.json();
                if (status.refreshRequestId && status.refreshRequestId !== refreshRequestId) {
                    throw new Error('刷新请求已被替换');
                }
                const acknowledgedCount = Number(status.acknowledgedRoomCount || 0);
                const pendingCount = Number(status.pendingRoomCount || 0);
                setRefreshButtonState('loading', `等待响应 ${acknowledgedCount}/${targetCount}`);
                if (status.status === 'complete' || pendingCount === 0) return status;
            }
            return null;
        }

        async function requestImmediateRefresh() {
            if (refreshNowBtn.disabled) return;
            setRefreshButtonState('loading', '下发中');
            try {
                const response = await fetch('/api/control/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                const targetCount = Number(result.requestedRoomCount ?? result.targetRoomsCount ?? result.activeRoomsCount);
                if (!Number.isFinite(targetCount) || targetCount <= 0) {
                    setRefreshButtonState('success', '暂无在线直播间');
                    showRefreshToast('warning', '暂无在线直播间可刷新');
                } else {
                    setRefreshButtonState('loading', `等待响应 0/${targetCount}`);
                    const completed = await waitForRefreshCompletion(result.refreshRequestId, targetCount);
                    if (completed) {
                        setRefreshButtonState('success', '刷新完成');
                        showRefreshToast('success', '刷新完成');
                    } else {
                        const statusResponse = await fetch('/api/control/refresh', { cache: 'no-store' });
                        const status = statusResponse.ok ? await statusResponse.json() : {};
                        const pendingCount = Number(status.pendingRoomCount ?? targetCount);
                        setRefreshButtonState('error', '未全部响应');
                        showRefreshToast('warning', `仍有 ${pendingCount} 个直播间未响应`);
                    }
                }
            } catch (error) {
                console.error('立即刷新失败:', error);
                setRefreshButtonState('error', '刷新失败');
                showRefreshToast('error', '刷新失败，请稍后重试');
            }
            refreshResetTimer = setTimeout(() => setRefreshButtonState('idle', '立即刷新'), 2200);
        }

        function formatCurrency(val) {
            if (val === null || val === undefined) return '-';
            return '¥' + Number(val || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatPercent(val) {
            if (val === null || val === undefined) return '-';
            return (Number(val) * 100).toFixed(2) + '%';
        }

        function formatSeconds(val) {
            if (val === null || val === undefined) return '-';
            return Math.round(Number(val)) + ' 秒';
        }

        function formatTime(ts) {
            const d = ts ? new Date(ts) : new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatOptionalTime(ts) {
            return ts ? formatTime(ts) : '-';
        }

        const DEFAULT_PRODUCT_SORT = Object.freeze({
            key: 'product_pay_amount_yuan',
            direction: 'desc'
        });
        const PRODUCT_SORT_FIELDS = new Set([
            'product_pay_amount_yuan',
            'product_show_users_count',
            'product_click_users_count',
            'product_show_click_users_ratio',
            'product_click_pay_users_ratio',
            'product_gpm_amount_yuan'
        ]);
        const productSortByRoom = new Map();
        let latestRooms = [];

        function getProductSort(roomId) {
            return productSortByRoom.get(String(roomId)) || DEFAULT_PRODUCT_SORT;
        }

        function getNextProductSort(currentSort, key) {
            return {
                key,
                direction: currentSort.key === key && currentSort.direction === 'desc'
                    ? 'asc'
                    : 'desc'
            };
        }

        function toSortableNumber(value) {
            if (value === null || value === undefined || value === '') return null;
            const numericValue = Number(value);
            return Number.isFinite(numericValue) ? numericValue : null;
        }

        function sortProducts(products, sortState = DEFAULT_PRODUCT_SORT) {
            const source = Array.isArray(products) ? products : [];
            const key = PRODUCT_SORT_FIELDS.has(sortState?.key)
                ? sortState.key
                : DEFAULT_PRODUCT_SORT.key;
            const direction = sortState?.direction === 'asc' ? 'asc' : 'desc';

            return source
                .map((product, index) => ({
                    product,
                    index,
                    value: toSortableNumber(product?.[key])
                }))
                .sort((left, right) => {
                    if (left.value === null && right.value === null) return left.index - right.index;
                    if (left.value === null) return 1;
                    if (right.value === null) return -1;
                    if (left.value === right.value) return left.index - right.index;
                    return direction === 'asc'
                        ? left.value - right.value
                        : right.value - left.value;
                })
                .map(item => item.product);
        }

        function renderProductSortHeader(roomId, key, label) {
            const sortState = getProductSort(roomId);
            const isActive = sortState.key === key;
            const isDescending = sortState.direction === 'desc';
            const ariaSort = isActive ? (isDescending ? 'descending' : 'ascending') : 'none';
            const indicator = isActive ? (isDescending ? '↓' : '↑') : '↕';
            const currentState = isActive ? `当前${isDescending ? '倒序' : '升序'}` : '当前未排序';
            const nextDirection = isActive && isDescending ? '升序' : '倒序';
            const actionLabel = `${label}，${currentState}，点击按${nextDirection}排列`;

            return `
                <th style="text-align: right;" aria-sort="${ariaSort}">
                    <button class="product-sort-button ${isActive ? 'is-active' : ''}"
                            type="button"
                            data-room-id="${encodeURIComponent(String(roomId))}"
                            data-sort-key="${key}"
                            aria-label="${actionLabel}"
                            title="${actionLabel}">
                        <span>${label}</span>
                        <span class="product-sort-indicator" aria-hidden="true">${indicator}</span>
                    </button>
                </th>
            `;
        }

        function setProductSort(roomId, key) {
            if (!PRODUCT_SORT_FIELDS.has(key)) return;
            const normalizedRoomId = String(roomId);
            const nextSort = getNextProductSort(getProductSort(normalizedRoomId), key);
            productSortByRoom.set(normalizedRoomId, nextSort);
            updateTable(latestRooms);
        }

        tableBody.addEventListener('click', event => {
            const sortButton = event.target.closest('.product-sort-button');
            if (!sortButton) return;
            event.preventDefault();
            event.stopPropagation();
            const roomId = decodeURIComponent(sortButton.dataset.roomId || '');
            setProductSort(roomId, sortButton.dataset.sortKey || '');
        });

        const expandedRooms = new Set();
        let allExpanded = false;

        function toggleRoom(roomId) {
            if (expandedRooms.has(roomId)) {
                expandedRooms.delete(roomId);
            } else {
                expandedRooms.add(roomId);
            }
            const mainRow = document.getElementById(`row-${roomId}`);
            const cardRow = document.getElementById(`card-${roomId}`);
            if (mainRow && cardRow) {
                const isExp = expandedRooms.has(roomId);
                if (isExp) {
                    mainRow.classList.add('is-expanded');
                    cardRow.classList.remove('hidden');
                    cardRow.classList.remove('is-entering');
                    void cardRow.offsetWidth;
                    cardRow.classList.add('is-entering');
                    setTimeout(() => cardRow.classList.remove('is-entering'), 280);
                } else {
                    mainRow.classList.remove('is-expanded');
                    cardRow.classList.add('hidden');
                    cardRow.classList.remove('is-entering');
                }
            }
        }

        function toggleAllRooms() {
            allExpanded = !allExpanded;
            const btn = document.getElementById('toggleAllBtn');
            btn.textContent = allExpanded ? '全部收起商品 ▲' : '全部展开商品 ▼';
            const allRows = document.querySelectorAll('.main-row');
            allRows.forEach(row => {
                const roomId = row.getAttribute('data-room-id');
                if (roomId) {
                    if (allExpanded) expandedRooms.add(roomId);
                    else expandedRooms.delete(roomId);
                    const card = document.getElementById(`card-${roomId}`);
                    if (card) {
                        if (allExpanded) {
                            row.classList.add('is-expanded');
                            card.classList.remove('hidden');
                        } else {
                            row.classList.remove('is-expanded');
                            card.classList.add('hidden');
                        }
                    }
                }
            });
        }

        function updateTable(rooms) {
            const list = rooms || [];
            latestRooms = list;
            activeCountLabel.textContent = `当前监控: ${list.length} 个直播间`;

            if (list.length === 0) {
                emptyElement.style.display = 'block';
                tableCard.style.display = 'none';
                return;
            }

            emptyElement.style.display = 'none';
            tableCard.style.display = 'block';

            tableBody.innerHTML = list.map(room => {
                const m = room.latestMetrics || {};
                const isOnline = room.isOnline;
                const timeStr = formatTime(room.lastHeartbeatTs);
                const productTimeStr = formatOptionalTime(room.productList?.collection?.observedAtIso);

                const gpm = m.gpm_amount_yuan;
                const watchPayRatio = (m.watch_pay_ucnt_ratio !== null && m.watch_pay_ucnt_ratio !== undefined) ? m.watch_pay_ucnt_ratio : m.watch_to_pay_ratio;
                const avgDuration = m.avg_watch_duration_seconds;
                const adCost = m.ad_cost_yuan;
                const oldFansRatio = m.old_fans_pay_ucnt_ratio;
                const interactRatio = m.interact_watch_ucnt_ratio;
                const followRatio = m.follow_anchor_watch_ucnt_ratio;
                const refundRatio = m.real_refund_amt_ratio;

                // 商品列表数据提取
                let products = [];
                if (room.productList && Array.isArray(room.productList.products) && room.productList.products.length > 0) {
                    products = room.productList.products;
                } else if (room.explainingProduct && room.explainingProduct.productName) {
                    const ep = room.explainingProduct;
                    products = [{
                        cartIndex: ep.cartIndex || 1,
                        productId: ep.productId,
                        productName: ep.productName,
                        productImg: ep.productImg,
                        isExplaining: ep.isExplaining,
                        product_pay_amount_yuan: ep.product_pay_amount_yuan,
                        product_show_users_count: null,
                        product_click_users_count: ep.recentFiveMinClickCount,
                        product_show_click_users_ratio: null,
                        product_click_pay_users_ratio: null,
                        product_gpm_amount_yuan: null
                    }];
                }

                const sortedProducts = sortProducts(products, getProductSort(room.roomId));
                const productRowsHtml = sortedProducts.length > 0 ? sortedProducts.map((prod, pIdx) => {
                    const showCnt = prod.product_show_users_count !== null && prod.product_show_users_count !== undefined ? Number(prod.product_show_users_count).toLocaleString('zh-CN') : '-';
                    const clickCnt = prod.product_click_users_count !== null && prod.product_click_users_count !== undefined ? Number(prod.product_click_users_count).toLocaleString('zh-CN') : '-';
                    return `
                        <tr>
                            <td><span class="cart-tag">#${prod.cartIndex || (pIdx + 1)}</span></td>
                            <td>
                                <div class="prod-name" title="${prod.productName || '商品名称缺失'}">${prod.productName || '商品名称缺失'}</div>
                            </td>
                            <td style="text-align: right;"><div class="num-cell" style="color:var(--gpm-color);">${formatCurrency(prod.product_pay_amount_yuan)}</div></td>
                            <td style="text-align: right;"><div class="num-cell">${showCnt}</div></td>
                            <td style="text-align: right;"><div class="num-cell">${clickCnt}</div></td>
                            <td style="text-align: right;"><div class="num-cell" style="color:var(--ratio-color);">${formatPercent(prod.product_show_click_users_ratio)}</div></td>
                            <td style="text-align: right;"><div class="num-cell" style="color:var(--ratio-color);">${formatPercent(prod.product_click_pay_users_ratio)}</div></td>
                            <td style="text-align: right;"><div class="num-cell" style="color:var(--gpm-color);">${formatCurrency(prod.product_gpm_amount_yuan)}</div></td>
                            <td style="text-align: right;"><div class="val-time">${productTimeStr}</div></td>
                        </tr>
                    `;
                }).join('') : `
                    <tr>
                        <td colspan="9" style="text-align:center;color:#94a3b8;padding:14px;">暂无商品数据</td>
                    </tr>
                `;

                const isExpanded = expandedRooms.has(room.roomId);

                // 检测是否变动以触发高亮
                const prev = prevValues[room.roomId];
                const hasChanged = prev && (prev.gpm !== gpm || prev.watchPayRatio !== watchPayRatio);
                prevValues[room.roomId] = { gpm, watchPayRatio };

                return `
                    <tr class="main-row ${hasChanged ? 'flash-update' : ''} ${isExpanded ? 'is-expanded' : ''}" id="row-${room.roomId}" data-room-id="${room.roomId}" onclick="toggleRoom('${room.roomId}')">
                        <td style="padding-left: 20px;">
                            <div class="room-cell">
                                <span class="expand-caret">▶</span>
                                <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                                <div class="room-name-text">${room.shopName || room.roomId}</div>
                            </div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell val-gpm">${formatCurrency(gpm)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell val-watch-ratio">${formatPercent(watchPayRatio)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell ${avgDuration !== null ? '' : 'val-muted'}">${formatSeconds(avgDuration)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell val-cost">${formatCurrency(adCost)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell ${oldFansRatio !== null ? '' : 'val-muted'}">${formatPercent(oldFansRatio)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell ${interactRatio !== null ? '' : 'val-muted'}">${formatPercent(interactRatio)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell ${followRatio !== null ? '' : 'val-muted'}">${formatPercent(followRatio)}</div>
                        </td>
                        <td style="text-align: right;">
                            <div class="num-cell ${refundRatio !== null ? '' : 'val-muted'}">${formatPercent(refundRatio)}</div>
                        </td>
                        <td style="text-align: right; padding-right: 20px;">
                            <div class="val-time">${timeStr}</div>
                        </td>
                    </tr>
                    <tr class="card-row ${isExpanded ? '' : 'hidden'}" id="card-${room.roomId}">
                        <td colspan="10" style="padding: 0;">
                            <div class="subtable-wrap">
                                <div class="subtable-container">
                                    <table class="product-subtable">
                                        <thead>
                                            <tr>
                                                <th style="width: 54px; text-align: left;">序号</th>
                                                <th style="min-width: 260px; text-align: left;">商品信息</th>
                                                ${renderProductSortHeader(room.roomId, 'product_pay_amount_yuan', '累计用户支付金额')}
                                                ${renderProductSortHeader(room.roomId, 'product_show_users_count', '商品曝光人数')}
                                                ${renderProductSortHeader(room.roomId, 'product_click_users_count', '商品点击人数')}
                                                ${renderProductSortHeader(room.roomId, 'product_show_click_users_ratio', '曝光-点击转化率')}
                                                ${renderProductSortHeader(room.roomId, 'product_click_pay_users_ratio', '点击-成交转化率')}
                                                ${renderProductSortHeader(room.roomId, 'product_gpm_amount_yuan', '商品千次曝光成交')}
                                                <th style="text-align: right; width: 90px;">更新时间</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${productRowsHtml}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function connectSse() {
            const es = new EventSource('/api/stream/subscribe');
            es.onmessage = function (e) {
                try {
                    const snapshot = JSON.parse(e.data);
                    updateTable(snapshot.rooms || []);
                } catch (err) {
                    console.error('SSE Error:', err);
                }
            };
            es.onerror = function () {
                es.close();
                setTimeout(connectSse, 3000);
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            connectSse();
        });
    </script>
</body>
</html>
